<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemGarden</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌱</text></svg>">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<!-- The graph fills the viewport; sigma mounts into it (E3). Everything else
     floats over it. -->
<div id="canvas" aria-hidden="true"></div>
<p id="canvas-empty">Search, or open a filter, to draw a graph.</p>

<!-- Hover preview for graph nodes. `aria-hidden` like the canvas it serves:
     every node it describes is also a button in the detail panel, which is the
     keyboard path and the accessible one. -->
<div id="peek" hidden aria-hidden="true"></div>

<section id="search-panel" aria-label="Search">
  <header>
    <h1>MemGarden</h1>
    <select id="bank" aria-label="Bank"></select>
  </header>
  <form id="search-form">
    <input id="q" type="search" placeholder="What would be recalled for…"
           autocomplete="off" autofocus>
  </form>

  <!-- E3's filters. Collapsed by default: search is the primary way in, and
       the filters are the way to look at a bank you cannot phrase a query
       for. -->
  <details id="filters">
    <summary>Filters</summary>
    <div class="filter-grid">
      <label for="f-types">Types</label>
      <div id="f-types" class="type-checks">
        <label><input type="checkbox" value="world" checked> world</label>
        <label><input type="checkbox" value="observation" checked> observation</label>
        <label><input type="checkbox" value="experience" checked> experience</label>
      </div>

      <label for="f-session">Session</label>
      <input id="f-session" type="text" placeholder="session id" autocomplete="off">

      <label for="f-since">From</label>
      <input id="f-since" type="date">

      <label for="f-until">To</label>
      <input id="f-until" type="date">

      <label for="f-limit">Limit</label>
      <input id="f-limit" type="number" min="1" max="2000" value="200">
    </div>
    <button id="f-apply" type="button">Draw</button>
  </details>

  <p id="search-status" role="status"></p>
  <ol id="results"></ol>
</section>

<aside id="detail-panel" hidden aria-label="Memory detail">
  <button id="detail-close" aria-label="Close">×</button>
  <div id="detail"></div>
</aside>

<!-- Graph legend and the count, which is also how you notice an expansion
     landed. -->
<div id="graph-status" aria-hidden="true"></div>

<!-- Vendored, not fetched: see ui/vendor/README.md. Order matters — the three
     d3 modules attach to the same `d3` global that d3-force then reads. -->
<script src="/ui/vendor/graphology.js"></script>
<script src="/ui/vendor/d3-dispatch.js"></script>
<script src="/ui/vendor/d3-quadtree.js"></script>
<script src="/ui/vendor/d3-timer.js"></script>
<script src="/ui/vendor/d3-force.js"></script>
<script src="/ui/vendor/sigma.js"></script>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
