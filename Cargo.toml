[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rusqlite = { version = "0.40", features = ["bundled", "functions", "limits"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
sqlite-vec = "=0.1.9"
uuid = { version = "1", features = ["v4", "v7", "serde"] } # v4: mental-model ids are
                                                        # "mm-<uuid4hex>" (CE-10, legacy parity)
thiserror = "2"
anyhow = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
fastembed = { version = "=5.17.4", default-features = false, features = [
    "hf-hub-rustls-tls", "ort-download-binaries-rustls-tls",
] } # B1. ort 2.0.0-rc.13 underneath. NOT the default features: they add
    # `image-models` and a second (native) TLS stack.
jiff = "0.2.35" # B1 (embed augmentation "%B %Y"), later CE-8.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
] } # B2. No TLS stack at all — Ollama is loopback-only HTTP
    # (http://127.0.0.1:11434), so there is nothing to negotiate a
    # certificate for. Do not add a tls feature "just in case".
tiktoken-rs = "0.12.0" # B3 (retain cap accounting), later B4 (recall budget).
                       # cl100k_base is the counter legacy uses, so ledger and
                       # budget numbers stay comparable. ~21ms one-time init,
                       # built once into a OnceLock — never per request.
sha2 = "0.10" # B3. Document content hashes for exact-match retain dedup
              # (legacy dedups on SHA-256 only, never cosine).
