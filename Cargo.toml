[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rusqlite = { version = "0.40", features = ["bundled", "functions", "limits"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
sqlite-vec = "=0.1.9"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
anyhow = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
