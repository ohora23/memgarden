name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual trigger, and it is here for a reason rather than as a nicety. The
  # repository was deleted and recreated on 2026-08-09; its 25 branches went up
  # in one `refs/heads/*:refs/heads/*` push, and GitHub raises no workflow event
  # for a bulk ref push. Four PRs then merged through the API without this file
  # ever being registered, so every check was run locally instead.
  # `workflow_dispatch` is the lever that does not depend on guessing which
  # event GitHub will honour.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # The hook binary's dependency closure (plan §Cross-PR rules 2). A hook
      # pays for its binary on every `execve`, and a stray
      # `use memgarden_store::…` compiles fine while silently adding a 90 s C
      # build and 1.5 MB of SQLite to a process that runs thousands of times
      # per session.
      #
      # An **allowlist**, not a denylist. The first version listed 11 forbidden
      # names, which is not containment: a future `ureq`/`hyper`/`rustls`/`libc`
      # would have passed green while the PR body claimed the closure was
      # enforced. This diffs the whole closure, so it fails on additions *and*
      # on removals, and the expected list is something a reviewer reads once
      # instead of a denylist someone has to remember to extend.
      #
      # `indexmap` appearing would additionally mean serde_json's
      # `preserve_order` got switched on somewhere, which feature unification
      # then applies to memgardend, reordering every API response.
      #
      # This is the ONLY one of the four hook budgets CI enforces. Size, `ldd`
      # and `LD_DEBUG` are human PR-body checks — `scripts/hook-budget.sh`
      # prints all four, and a green CI does not prove the other three.
      - name: memgarden-cli dependency containment
        run: |
          cargo tree -p memgarden-cli --edges normal --prefix none --no-dedupe \
            | awk 'NF {print $1}' | sort -u > /tmp/actual.txt
          cat > /tmp/expected.txt <<'CLOSURE'
          itoa
          memchr
          memgarden-cli
          memgarden-core
          proc-macro2
          quote
          serde
          serde_core
          serde_derive
          serde_json
          serde_spanned
          syn
          thiserror
          thiserror-impl
          toml
          toml_datetime
          toml_parser
          toml_writer
          unicode-ident
          winnow
          zmij
          CLOSURE
          sort -u -o /tmp/expected.txt /tmp/expected.txt
          if ! diff -u /tmp/expected.txt /tmp/actual.txt; then
            echo "::error::memgarden-cli's dependency closure changed. If the \
          addition is intended, justify it in the PR body and update this list \
          — the hook pays for every crate on every invocation."
            exit 1
          fi
