name: Release

# A tag `vX.Y.Z` builds both binaries with the tag as their build identity,
# packages them with the systemd units, and publishes a GitHub Release whose
# body is `docs/releases/<tag>.md` — so the notes are reviewed in a PR before
# the tag exists, and a tag without notes fails here instead of shipping
# silent. `memgarden self-update` downloads exactly these assets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: notes must exist, plugin version must match the tag
        run: |
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          test "v$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')" = "$GITHUB_REF_NAME"
      - name: build
        run: MEMGARDEN_BUILD="$GITHUB_REF_NAME" cargo build --release --bin memgardend --bin memgarden
      - name: package
        run: |
          set -euo pipefail
          name="memgarden-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name"
          cp target/release/memgardend target/release/memgarden "dist/$name/"
          cp scripts/systemd/memgardend.socket scripts/systemd/memgardend.service LICENSE "dist/$name/"
          tar -C "dist/$name" -czf "dist/$name.tar.gz" .
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ./target/release/memgardend --version
          ls -la dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "MemGarden $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            dist/*.tar.gz dist/*.sha256
