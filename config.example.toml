# memgardend configuration.
#
# Every key below is optional; anything left out falls back to the
# built-in default shown here. Copy to $XDG_CONFIG_HOME/memgarden/config.toml
# (or point MEMGARDEN_CONFIG at this file) to use it.
#
# Every value can also be overridden via environment, which wins over both
# this file and the built-in defaults:
#   MEMGARDEN_BIND, MEMGARDEN_DB_PATH, MEMGARDEN_LOG_LEVEL,
#   MEMGARDEN_METRICS_INTERVAL, MEMGARDEN_MODEL_DIR, MEMGARDEN_EMBED_THREADS,
#   MEMGARDEN_OLLAMA_URL, MEMGARDEN_OLLAMA_MODEL,
#   MEMGARDEN_RETAIN_MAX_INITIAL_MESSAGES, MEMGARDEN_RETAIN_TOOL_CALLS,
#   MEMGARDEN_PROFILE, MEMGARDEN_HOOKS_DISABLE, MEMGARDEN_DAEMON_URL

[server]
# Note: ports 9077 (hindsight) and 9090 (memdash) are already in use on
# this machine by unrelated legacy tooling. 9100 is memgarden's default.
bind = "127.0.0.1:9100"

[storage]
# Defaults to the XDG data dir: $XDG_DATA_HOME/memgarden/memgarden.db, or
# ~/.local/share/memgarden/memgarden.db if XDG_DATA_HOME is unset.
# "~" is expanded to $HOME.
db_path = "~/.local/share/memgarden/memgarden.db"

[log]
level = "info"

[metrics]
snapshot_interval_secs = 60

[embedding]
# In-binary CPU embeddings (bge-small-en-v1.5 via fastembed/ONNX). Off
# disables both the startup model load and the backlog worker; recall/retain
# in later PRs return 503 while this is loading.
enabled = true
# Defaults to the XDG data dir: $XDG_DATA_HOME/memgarden/models, or
# ~/.local/share/memgarden/models if XDG_DATA_HOME is unset. First run
# downloads ~133MB into this dir; subsequent runs are offline.
model_dir = "~/.local/share/memgarden/models"
# ONNX Runtime intra-op threads. 4 is the measured throughput/contention
# sweet spot on this machine (see the plan's Verified Environment Facts) —
# 8 buys ~0.7ms and contends with Ollama's CPU use.
intra_threads = 4
# Backlog-worker batch size. 8 caps a single batch's ONNX mutex hold to
# ~18ms so an interactive /v1/embed request never waits long behind a big
# backlog drain (Critic Revision R9).
batch_size = 8
# How often the backlog worker checks memory_nodes for embedding = NULL rows.
backlog_poll_secs = 5
# POST /v1/embed (text -> vector) is a debug tool, off by default.
debug_endpoint = false

[ollama]
# Fact extraction LLM (CE-5). Loopback HTTP only — memgardend never speaks
# TLS to Ollama, see the workspace Cargo.toml's reqwest comment.
base_url = "http://127.0.0.1:11434"
# The bare "qwen3-14b" tag does NOT exist on this machine — only
# "qwen3-14b-nothink:latest" / "qwen3-14b-q6:latest" do. This matches the
# live hindsight fork daemon's HINDSIGHT_API_LLM_MODEL.
model = "qwen3-14b-nothink:latest"
# legacy: config.py:210 DEFAULT_LLM_TEMPERATURE_RETAIN.
temperature = 0.1
# Deliberate divergence from legacy's 64000 (config.py:1094): at the
# measured ~65 tok/s that's a 16-minute worst case for one chunk. 8192
# comfortably covers a 3000-char chunk's facts.
num_predict = 8192
request_timeout_secs = 300
max_retries = 3
keep_alive = "10m"
# A 14B model sharing one GPU with nothing else must not be hit
# concurrently — keep at 1 unless Ollama is moved to dedicated hardware.
max_concurrent = 1

[retain]
# Transcript ingest (CE-5b). Every cap here runs SERVER-SIDE: the Phase C
# hook posts a raw transcript and does nothing else, because the
# retain_cap_saving ledger row is a store concern and the hook's whole
# budget is <10ms. All defaults are the hindsight fork's values.

# Initial-backfill cap. Applies ONLY to a session's first retain
# (`is_initial: true` in the request) and keeps the LAST N messages; 0
# disables it. This exists because a 102MB legacy transcript once blew the
# server's retain wall-clock limit. Delta retains are never capped.
max_initial_messages = 300
# Characters per extraction chunk; one Ollama call per chunk.
chunk_size = 3000
# Per-string-field cap inside a tool_use input. Long enough to keep the
# semantic signal of a code edit, short enough that a Write of a whole file
# stops dominating the payload.
tool_input_field_max = 300
# Second-tier cap: if the whole serialized input still exceeds this, only
# the priority keys (file_path, notebook_path, path, command, description,
# pattern, query, url) survive, plus a _truncated_fields list.
tool_input_total_max = 1500
# tool_result content truncation.
tool_result_max = 2000
# Max `file:<path>` tags attached per retain.
file_tag_cap = 20
# Bounded background-worker queue. A full queue answers HTTP 429 rather
# than buffering transcripts in RAM.
queue_capacity = 32
# Per-job wall clock, matching the live hindsight daemon's
# RETAIN_WALL_TIMEOUT=7200. Exceeding it marks the job failed with the
# partial progress intact.
wall_timeout_secs = 7200
# Retain tool calls at all. false is the fork's default; the "coding"
# profile below flips it to true (which is what the two caps above exist
# for). Left commented out on purpose: matching legacy, a key PRESENT in this
# file counts as explicitly set and a profile preset will not override it.
# include_tool_calls = false

[reranker]
# Embedded cross-encoder reranking (CE-11). When on, the model's
# sigmoid-normalised logit replaces the RRF-rank passthrough as the base
# relevance score; the recency / temporal / proof boosts are unchanged.
#
# OFF BY DEFAULT, AND OFF IS PARITY. The live hindsight daemon this rebuild
# is matched against runs HINDSIGHT_API_RERANKER_PROVIDER=rrf — a disabled
# cross-encoder — adopted as part of its 830ms -> 20ms latency fix. Turning
# this on is a divergence from the reference system, not a return to it.
enabled = false

# Hugging Face repo id. The ONNX export of
# cross-encoder/ms-marco-MiniLM-L-6-v2, which is the exact model legacy loads
# (engine/cross_encoder.py:103,131). fastembed has no built-in entry for it,
# so the five files (onnx/model.onnx + the four tokenizer files) are fetched
# by repo id into [embedding] model_dir on first run — ~90MB, cached after.
model = "Xenova/ms-marco-MiniLM-L-6-v2"

# How many RRF-ordered candidates the cross-encoder sees. The tail is
# DROPPED, exactly as legacy drops everything past rerank_limit, so this also
# caps what recall returns whenever it is below [recall] limit.
#
# Measured in-situ (interleaved-paired, 5 pairs) at top_k = 10: the whole
# recall gains +13.7ms p50 / +31.8ms p95, i.e. ~1.4ms/candidate at p50 and
# ~3.2ms/candidate at p95. AC-2 allows 35ms p50 / 60ms p95 for the ENTIRE
# recall; at top_k = 10 both still pass, with the margin cut from 28/51ms to
# 15/19ms. Legacy's thinking_budget*2 = 600 would be 10-30 SECONDS.
#
# 10 is the supported depth, and the choice against 20 is a LATENCY one, not
# a ranking one. Measured over 13 gold queries, top_k = 20 actually wins
# nDCG@10 (0.382 vs 0.379), recall@10 (0.397 vs 0.347) and the identifier
# stratum (0.595 vs 0.495); top_k = 10 wins MRR decisively (0.739 vs 0.606),
# which is the metric that matters for a rank-ordered injection. 20 costs
# double and drags background ingest below 90% of offered load.
# See docs/design/ce-11-reranker.md before changing this.
#
# Above 20 the daemon logs a startup warning — that threshold is about
# latency only; it does not mean 11..20 has been measured.
top_k = 10

# ONNX Runtime intra-op threads, same trade-off as [embedding] intra_threads.
threads = 4
# Query-document pairs per forward pass.
batch_size = 16

[consolidation]
# Cosine at or above which a newly stored observation is adjudicated against
# its nearest existing twin by one focused "merge or keep" LLM call.
# legacy: DEFAULT_CONSOLIDATION_DEDUP_THRESHOLD, config.py:1157.
#
# Set to 1.0 (or higher) to DISABLE semantic dedup entirely — no probe, no
# LLM call. Lowering it below ~0.95 starts merging observations that differ
# in a real detail; the LLM is the guard against that, not the threshold, but
# every extra probe is one more 14B-model call on the background path.
dedup_threshold = 0.97

# Seconds between background consolidation ticks (legacy:
# DEFAULT_CONSOLIDATION_RECONCILE_INTERVAL_SECONDS, config.py:1298).
# 0 disables the background task; POST /v1/banks/{id}/consolidate still runs a
# round manually. A tick is skipped entirely while a retain job is queued or in
# flight — consolidation has no latency SLO and ingest does.
interval_secs = 300

# Facts loaded per round (config.py:1149) and facts per LLM call
# (config.py:1153). The prompt's own hard token ceiling is a const in the code,
# NOT a config value — see docs/design/ce-9b-consolidation-round.md for why.
batch_size = 50
llm_batch_size = 8

# Outer attempts at one LLM batch before it is skipped (config.py:1147). The
# Ollama client retries transport and parse failures on its own; this retries a
# semantically invalid plan, which no transport retry would fix.
max_attempts = 3

# The per-fact recall that pools existing observations into the batch prompt
# (config.py:1163, :1167). `max_tokens` bounds how much existing-observation
# text one prompt may carry.
recall_budget = "low"
max_tokens = 512

[profile]
# Named preset that fills grouped defaults for a usage pattern. Precedence
# matches the fork: defaults -> this file -> env -> the preset fills only
# keys you did NOT set explicitly. "coding" is the only preset today.
#
# coding: include_tool_calls = true, recall_budget = "low", and the two
# mission strings below (verbatim from the fork's PROFILE_PRESETS).
#
# Shipped ON, because that is what MemGarden is for: with `name = ""` the
# built-in default include_tool_calls = false means tool calls are never
# retained, the two tool-input caps have nothing to cap, and a default
# install produces no retain_cap_saving ledger rows at all. Set it to "" if
# this daemon serves plain chat rather than coding sessions.
name = "coding"
# The three keys below are commented out for the same reason as
# include_tool_calls: uncommenting one pins it against the preset.
#
# Default mission for banks created without one. Per-bank override:
# banks.mission.
# bank_mission = ""
# Default extraction mission. Per-bank override: banks.disposition JSON
# {"retain_mission": "..."}; per-request override: the retain body's
# `mission` field.
# retain_mission = ""
# low | mid | high. Consumed by CE-6 recall; part of the ported preset.
# recall_budget = "mid"

# ---------------------------------------------------------------------------
# [hooks] — the Claude Code integration (Phase C).
#
# Read by BOTH binaries: `memgarden` (the hook CLI, on every invocation) and
# `memgardend` (only `session_retention_days`, for the sessions GC — the CLI
# applies the same window to its own state files).
#
# Nothing in this section does anything until `memgarden hooks install` wires
# the four events into ~/.claude/settings.json (C5), and even then the default
# mode injects nothing.
[hooks]
# Master switch. MEMGARDEN_HOOKS_DISABLE=1 does the same thing without an
# edit, and short-circuits before the config is even read.
enabled = true

# shadow | full. **shadow injects nothing** and is the default on purpose: the
# switch must not be thrown by the act of installing it. Turning injection on
# is a second, explicit step.
mode = "shadow"

# Loopback only. The client refuses any other host and the daemon's check_host
# would 403 it anyway. MEMGARDEN_DAEMON_URL overrides.
daemon_url = "http://127.0.0.1:9100"

# Client timeouts, all in milliseconds. They are unequal because the daemon's
# work behind each endpoint differs by four orders of magnitude:
#   connect — loopback connect is microseconds; 50 ms bounds a daemon that is
#             listening but not accepting.
#   recall  — ~10x the measured loaded p95. Past it the turn proceeds with no
#             memories (recall fails open).
#   retain  — POST /v1/retain does synchronous work before its 202 (tokenize
#             twice, upsert the document, insert the ledger and job rows);
#             ~0.6 s was observed on a 9.4 MB initial retain.
connect_timeout_ms = 50
recall_timeout_ms = 400
retain_timeout_ms = 5000

# Retain fires every N Stop hooks (legacy lib/config.py:34 retainEveryNTurns).
retain_every_n_turns = 10

# Ceiling on the recall query, in CHARACTERS — legacy's unit (recall.py:167),
# and the daemon's for its 5-character minimum. Capped at 2048 because a char
# is at most 4 UTF-8 bytes and the daemon refuses a query over 8 KB: any larger
# value could 400 on every prompt from a config that reads as fine.
recall_max_query_chars = 800

# Circuit breaker, on transport failures only (connection refused, timeout,
# unparseable body). A merely-down daemon lives here and can never poison a
# session: after this many consecutive failures the hook stops connecting for
# the cooldown, and any success clears it.
breaker_failures = 3
breaker_cooldown_secs = 60

# Poisoning, on durable 4xx rejections only — a different counter, because a
# daemon being down must never disable a session. Poisoning is a slow-retry
# state, not a latch: a poisoned session still retries once per
# poison_retry_secs, and `memgarden hooks status --clear-poison <sid>` is the
# manual exit.
max_reject_failures = 10
poison_retry_secs = 3600

# How many stale sessions the detached catch-up child works through per
# launch. 0 disables catch-up — but NOT the child, which also collects the
# state directory: a knob that means "catch up on fewer sessions" must not
# also mean "leak one state file per session, forever".
catchup_max_sessions = 3

# How long a session outlives its last sighting, on BOTH sides: memgardend
# collects the `sessions` row on the metrics tick, and the detached catch-up
# child collects the local state file with the same window. One number, so a
# row and its cache never disagree about whether a session still exists.
session_retention_days = 90

# Byte ceilings. max_post_bytes must stay at or under the daemon's 32 MB body
# limit — a larger value could only ever produce a 413.
max_post_bytes = 25165824
max_inject_bytes = 65536
shadow_log_max_bytes = 67108864

# Per-session hook state (a cache; the daemon's `sessions` row is
# authoritative). Defaults to <data_dir>/hooks. "~" is expanded to $HOME.
# state_dir = "~/.local/share/memgarden/hooks"

# Diagnostics on stderr. It never changes an exit code — legacy's equivalent
# flag is exactly what makes recall.py exit 2 and erase the user's prompt.
debug = false

# --- bank derivation ---
#
# Default: `claude-code::<project>`, byte-identical to the live legacy bank
# ids, which is what lets AC-1 compare the two systems on the same bank.
# `<project>` is the basename of the repository root containing the project
# dir — resolved by walking up for `.git` rather than by shelling out to
# `git rev-parse` (measured at 0.435 ms, more than the whole rest of a hook).
# Every worktree of a repo therefore shares one bank.

# Non-empty pins EVERY session to this bank id verbatim (legacy's static mode).
# bank_id = ""

# The `agent` segment of a dynamic bank id.
agent_name = "claude-code"

# Exact directory -> bank id overrides. Highest precedence, and compared after
# canonicalization. Empty by default, and skipped entirely when empty: each
# entry costs a canonicalize() syscall on the per-prompt path.
# [hooks.directory_bank_map]
# "/home/me/projects/thing" = "claude-code::thing"

# CE-10 mental models — the periodic distillation tier.
[mental]
# Seconds between refresh ticks. `0` disables the background task; the manual
# route `POST /v1/banks/{id}/mental-models/{id}/refresh` works either way.
#
# This bounds how *late* a refresh can be, not how much GPU it spends: the tick
# only asks which models are due by their own cron `trigger`, and a refresh with
# no new supporting facts preserves its content without an LLM call.
refresh_interval_secs = 600

# A model's own `trigger` decides when it is due. Two forms:
#   "0 4 * * *"            5-field cron, UTC — the clock asks whether anything
#                          happened since the last refresh
#   "@after-consolidation" woken when a consolidation round actually produces
#                          something, which is the moment its material appears
