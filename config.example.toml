# memgardend configuration.
#
# Every key below is optional; anything left out falls back to the
# built-in default shown here. Copy to $XDG_CONFIG_HOME/memgarden/config.toml
# (or point MEMGARDEN_CONFIG at this file) to use it.
#
# Every value can also be overridden via environment, which wins over both
# this file and the built-in defaults:
#   MEMGARDEN_BIND, MEMGARDEN_DB_PATH, MEMGARDEN_LOG_LEVEL,
#   MEMGARDEN_METRICS_INTERVAL, MEMGARDEN_MODEL_DIR, MEMGARDEN_EMBED_THREADS,
#   MEMGARDEN_OLLAMA_URL, MEMGARDEN_OLLAMA_MODEL,
#   MEMGARDEN_RETAIN_MAX_INITIAL_MESSAGES, MEMGARDEN_RETAIN_TOOL_CALLS,
#   MEMGARDEN_PROFILE

[server]
# Note: ports 9077 (hindsight) and 9090 (memdash) are already in use on
# this machine by unrelated legacy tooling. 9100 is memgarden's default.
bind = "127.0.0.1:9100"

[storage]
# Defaults to the XDG data dir: $XDG_DATA_HOME/memgarden/memgarden.db, or
# ~/.local/share/memgarden/memgarden.db if XDG_DATA_HOME is unset.
# "~" is expanded to $HOME.
db_path = "~/.local/share/memgarden/memgarden.db"

[log]
level = "info"

[metrics]
snapshot_interval_secs = 60

[embedding]
# In-binary CPU embeddings (bge-small-en-v1.5 via fastembed/ONNX). Off
# disables both the startup model load and the backlog worker; recall/retain
# in later PRs return 503 while this is loading.
enabled = true
# Defaults to the XDG data dir: $XDG_DATA_HOME/memgarden/models, or
# ~/.local/share/memgarden/models if XDG_DATA_HOME is unset. First run
# downloads ~133MB into this dir; subsequent runs are offline.
model_dir = "~/.local/share/memgarden/models"
# ONNX Runtime intra-op threads. 4 is the measured throughput/contention
# sweet spot on this machine (see the plan's Verified Environment Facts) —
# 8 buys ~0.7ms and contends with Ollama's CPU use.
intra_threads = 4
# Backlog-worker batch size. 8 caps a single batch's ONNX mutex hold to
# ~18ms so an interactive /v1/embed request never waits long behind a big
# backlog drain (Critic Revision R9).
batch_size = 8
# How often the backlog worker checks memory_nodes for embedding = NULL rows.
backlog_poll_secs = 5
# POST /v1/embed (text -> vector) is a debug tool, off by default.
debug_endpoint = false

[ollama]
# Fact extraction LLM (CE-5). Loopback HTTP only — memgardend never speaks
# TLS to Ollama, see the workspace Cargo.toml's reqwest comment.
base_url = "http://127.0.0.1:11434"
# The bare "qwen3-14b" tag does NOT exist on this machine — only
# "qwen3-14b-nothink:latest" / "qwen3-14b-q6:latest" do. This matches the
# live hindsight fork daemon's HINDSIGHT_API_LLM_MODEL.
model = "qwen3-14b-nothink:latest"
# legacy: config.py:210 DEFAULT_LLM_TEMPERATURE_RETAIN.
temperature = 0.1
# Deliberate divergence from legacy's 64000 (config.py:1094): at the
# measured ~65 tok/s that's a 16-minute worst case for one chunk. 8192
# comfortably covers a 3000-char chunk's facts.
num_predict = 8192
request_timeout_secs = 300
max_retries = 3
keep_alive = "10m"
# A 14B model sharing one GPU with nothing else must not be hit
# concurrently — keep at 1 unless Ollama is moved to dedicated hardware.
max_concurrent = 1

[retain]
# Transcript ingest (CE-5b). Every cap here runs SERVER-SIDE: the Phase C
# hook posts a raw transcript and does nothing else, because the
# retain_cap_saving ledger row is a store concern and the hook's whole
# budget is <10ms. All defaults are the hindsight fork's values.

# Initial-backfill cap. Applies ONLY to a session's first retain
# (`is_initial: true` in the request) and keeps the LAST N messages; 0
# disables it. This exists because a 102MB legacy transcript once blew the
# server's retain wall-clock limit. Delta retains are never capped.
max_initial_messages = 300
# Characters per extraction chunk; one Ollama call per chunk.
chunk_size = 3000
# Per-string-field cap inside a tool_use input. Long enough to keep the
# semantic signal of a code edit, short enough that a Write of a whole file
# stops dominating the payload.
tool_input_field_max = 300
# Second-tier cap: if the whole serialized input still exceeds this, only
# the priority keys (file_path, notebook_path, path, command, description,
# pattern, query, url) survive, plus a _truncated_fields list.
tool_input_total_max = 1500
# tool_result content truncation.
tool_result_max = 2000
# Max `file:<path>` tags attached per retain.
file_tag_cap = 20
# Bounded background-worker queue. A full queue answers HTTP 429 rather
# than buffering transcripts in RAM.
queue_capacity = 32
# Per-job wall clock, matching the live hindsight daemon's
# RETAIN_WALL_TIMEOUT=7200. Exceeding it marks the job failed with the
# partial progress intact.
wall_timeout_secs = 7200
# Retain tool calls at all. false is the fork's default; the "coding"
# profile below flips it to true (which is what the two caps above exist
# for). Left commented out on purpose: matching legacy, a key PRESENT in this
# file counts as explicitly set and a profile preset will not override it.
# include_tool_calls = false

[consolidation]
# Cosine at or above which a newly stored observation is adjudicated against
# its nearest existing twin by one focused "merge or keep" LLM call.
# legacy: DEFAULT_CONSOLIDATION_DEDUP_THRESHOLD, config.py:1157.
#
# Set to 1.0 (or higher) to DISABLE semantic dedup entirely — no probe, no
# LLM call. Lowering it below ~0.95 starts merging observations that differ
# in a real detail; the LLM is the guard against that, not the threshold, but
# every extra probe is one more 14B-model call on the background path.
dedup_threshold = 0.97

# Seconds between background consolidation ticks (legacy:
# DEFAULT_CONSOLIDATION_RECONCILE_INTERVAL_SECONDS, config.py:1298).
# 0 disables the background task; POST /v1/banks/{id}/consolidate still runs a
# round manually. A tick is skipped entirely while a retain job is queued or in
# flight — consolidation has no latency SLO and ingest does.
interval_secs = 300

# Facts loaded per round (config.py:1149) and facts per LLM call
# (config.py:1153). The prompt's own hard token ceiling is a const in the code,
# NOT a config value — see docs/design/ce-9b-consolidation-round.md for why.
batch_size = 50
llm_batch_size = 8

# Outer attempts at one LLM batch before it is skipped (config.py:1147). The
# Ollama client retries transport and parse failures on its own; this retries a
# semantically invalid plan, which no transport retry would fix.
max_attempts = 3

# The per-fact recall that pools existing observations into the batch prompt
# (config.py:1163, :1167). `max_tokens` bounds how much existing-observation
# text one prompt may carry.
recall_budget = "low"
max_tokens = 512

[profile]
# Named preset that fills grouped defaults for a usage pattern. Precedence
# matches the fork: defaults -> this file -> env -> the preset fills only
# keys you did NOT set explicitly. "coding" is the only preset today.
#
# coding: include_tool_calls = true, recall_budget = "low", and the two
# mission strings below (verbatim from the fork's PROFILE_PRESETS).
#
# Shipped ON, because that is what MemGarden is for: with `name = ""` the
# built-in default include_tool_calls = false means tool calls are never
# retained, the two tool-input caps have nothing to cap, and a default
# install produces no retain_cap_saving ledger rows at all. Set it to "" if
# this daemon serves plain chat rather than coding sessions.
name = "coding"
# The three keys below are commented out for the same reason as
# include_tool_calls: uncommenting one pins it against the preset.
#
# Default mission for banks created without one. Per-bank override:
# banks.mission.
# bank_mission = ""
# Default extraction mission. Per-bank override: banks.disposition JSON
# {"retain_mission": "..."}; per-request override: the retain body's
# `mission` field.
# retain_mission = ""
# low | mid | high. Consumed by CE-6 recall; part of the ported preset.
# recall_budget = "mid"
